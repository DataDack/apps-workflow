name: Set up build toolchain
description: >
  Install the language runtime a build needs and restore its dependency cache.
  One place, so adding a toolchain is a change here rather than in the workflow.

inputs:
  toolchain:
    description: node (the only one this runner supports today)
    required: false
    default: node
  node_version:
    description: The major the project builds against.
    required: true
  install_command:
    description: >
      The command the build will install with. Optional, and used only to check
      that the tool it names is actually on this runner — see the last step.
    required: false
    default: ""
  bun_version:
    description: >
      Pinned exactly, never a floating major. A build input that can move on its
      own changes a customer's build with no change to their repository — and
      when it breaks, they cannot diagnose it. This platform has already lost a
      build to exactly that, when a floating Bun major stopped being able to
      extract a large package.
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Reject an unsupported toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        # Named rather than assumed. When Python and Go land for the dynamic
        # frameworks, they are added here and nothing in the workflow changes.
        case "$TOOLCHAIN" in
          node|"") ;;
          *)
            echo "::error::toolchain '$TOOLCHAIN' is not supported by this runner yet — supported: node"
            exit 1 ;;
        esac

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    # pnpm and Yarn, from Corepack — which ships with Node, so this costs a
    # pair of shims and no download: the manager itself is fetched on first use
    # and only for the one a build actually calls.
    #
    # They were missing entirely. The platform picks an install command from
    # whichever lockfile a repository has, so a pnpm-lock.yaml produces
    # `pnpm install --frozen-lockfile`, and this action set up Node and Bun and
    # nothing else — `npm ci` worked only because npm arrives with Node. Every
    # pnpm and Yarn repository died on the first line of its install step. The
    # cache paths below have been reserving ~/.cache/yarn and the pnpm store the
    # whole time, for managers that were never installed.
    - name: Set up pnpm and Yarn
      shell: bash
      env:
        # Corepack otherwise stops on an interactive "download this?" prompt,
        # which on a runner is silence until the job times out.
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        set -euo pipefail
        if corepack enable pnpm yarn 2>/dev/null; then
          echo "pnpm and Yarn are available through Corepack"
        else
          # Corepack is bundled with Node today but has been slated for
          # unbundling, and a runner image can also ship a Yarn that already
          # owns the name. Neither is worth failing a build that may use
          # neither manager, so fall back rather than exit.
          echo "::warning::Corepack is unavailable; installing pnpm and Yarn globally instead"
          npm install --global pnpm yarn
        fi

    - name: Set up Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun_version }}
      run: npm install --global "bun@${BUN_VERSION}"

    # The install command names a binary, and this is where a missing one is
    # cheap to find. It is the same argument the toolchain check at the top of
    # this action makes, one level down: failing HERE says which tool is absent,
    # while letting the install step discover it produces
    # "bash: line 1: pnpm: command not found" — which reads as a broken
    # repository rather than as a runner that was never given pnpm.
    #
    # Deliberately a check and not a provisioning step. Anything this runner is
    # meant to support is installed above; reaching this and failing means the
    # platform sent a command for a manager nobody taught this action about, and
    # guessing at an install for it is how the wrong one ends up resolving a
    # lockfile it does not understand.
    - name: Verify the install command can run
      if: inputs.install_command != ''
      shell: bash
      env:
        DATADACK_COMMAND: ${{ inputs.install_command }}
      run: |
        set -euo pipefail
        bin=$(printf '%s\n' "$DATADACK_COMMAND" | awk '{print $1}')
        if [ -z "$bin" ]; then
          echo "::error::the platform sent an empty install command"
          exit 1
        fi
        if ! command -v "$bin" >/dev/null 2>&1; then
          echo "::error::the install command runs '$bin', which is not on this runner — available: npm, pnpm, yarn, bun"
          exit 1
        fi
        echo "install command runs $bin ($(command -v "$bin"))"

    # Every build re-downloaded its whole dependency tree before this:
    # setup-node was used without its `cache:` input, so nothing survived
    # between runs. For a typical React or Next.js app that is the largest
    # single slice of build time.
    #
    # The package manager is the customer's choice and their install command is
    # arbitrary, so rather than guess one, every common cache directory is kept
    # and the key is the hash of whichever lockfiles the repository actually
    # has. A repository with no lockfile misses every time, which is correct —
    # there is nothing stable to key on.
    - name: Restore dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/yarn
          ~/.local/share/pnpm/store
          ~/.bun/install/cache
        key: >-
          datadack-deps-${{ runner.os }}-node${{ inputs.node_version }}-${{
          hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/bun.lock', '**/bun.lockb') }}
        # A partial match beats a cold download: the tree is mostly the same
        # between two commits, so an older entry warms most of it and the
        # install fetches only what moved.
        restore-keys: |
          datadack-deps-${{ runner.os }}-node${{ inputs.node_version }}-
          datadack-deps-${{ runner.os }}-
